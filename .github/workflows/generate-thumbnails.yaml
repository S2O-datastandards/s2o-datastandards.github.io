name: generate-thumbnails
run-name: Generate thumbnails from PDFs

on:
  push:
    paths:
      - 'publications/*.pdf'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils

      - name: Generate thumbnails
        run: bash _scripts/generate_thumbnails.sh

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/pub_thumbnail/*.jpg
          if git diff --cached --quiet; then
            echo "No new thumbnails to commit"
          else
            git commit -m "Auto-generate thumbnails from PDFs"
            git push
          fi
