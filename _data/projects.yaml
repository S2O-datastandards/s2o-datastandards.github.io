- title: Supporting source-to-outcome assessment in toxicology through data interoperability 
  subtitle: SOT 2026
  group: featured
  image: images/pub_thumbnail/sot_2026_poster_thumbnail.jpg
  link: https://s2o-datastandards.github.io/publications/ds_sot_2026_poster_final.pdf
  description: A LinkML-based data model schema, developed through expert working group engagement, is applied to a PM₂.₅ Adverse Outcome Pathway Bayesian Network to demonstrate probabilistic prediction of mechanistic key events.
  repo: S2O-datastandards/s2o-datastandards
  tags:
    - poster
    
- title: A mechanistic use case to support data interoperability across the source to outcome continuum in Environmental Health Science 
  subtitle: NCSOT 2025
  group: featured
  image: images/pub_thumbnail/ncsot_2025_poster_thumbnail.jpg
  link: https://s2o-datastandards.github.io/publications/ds_ncsot_2025_poster_final.pdf
  description: A preliminary Adverse Outcome Pathway Bayesian Network linking PM₂.₅ exposure to decreased lung function is developed as a quantitative test system for evaluating data interoperability standards.
  repo: S2O-datastandards/s2o-datastandards
  tags:
    - poster

- title: Data Standards to Support Integrated Source to Outcome Modeling
  subtitle: SOT 2025
  image: images/pub_thumbnail/sot_2025_poster_thumbnail.jpg
